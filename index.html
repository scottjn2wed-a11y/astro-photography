<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>探索宇宙深處｜深空天文攝影入門</title><meta name="description" content="從星空攝影分類、器材到拍攝規劃與後製的天文攝影入門教材。"><link rel="stylesheet" href="style.css"><script defer src="data.js"></script><script defer src="app.js"></script></head><body><header><a href="#home" class="brand">✦ 探索宇宙深處</a><nav><a href="#chapters">章節</a><a href="#tools">互動工具</a><button id="present">線上簡報</button></nav></header><main id="home"><section class="hero"><div><small>EXPLORE THE UNIVERSE</small><h1>深空天文攝影入門</h1><h2>一半是科學，一半是藝術</h2><p>從捕捉宇宙微光，到呈現星空之美。</p><a class="btn" href="#chapters">開始探索 ↓</a></div></section><div class="wrap"><section id="chapters"><small>THE JOURNEY</small><h2>探索章節</h2><div id="toc" class="toc"></div></section><div id="content"></div><section id="tools"><small>INTERACTIVE LAB · 延伸教學</small><h2>拍攝規劃工具</h2><div class="tools"><article><h3>波爾特指數</h3><label for="bortle">光害等級 <output id="bnum">4</output></label><input id="bortle" type="range" min="1" max="9" value="4"><div id="sky" aria-hidden="true"></div><p id="bdesc"></p><small>示意圖，非實際天空亮度測量。</small></article><article><h3>FOV 視野計算器</h3><label>焦距 (mm)<input id="f" type="number" min="1" value="544"></label><label>感光元件寬 (mm)<input id="w" type="number" min="0.1" step="0.1" value="11.2"></label><label>感光元件高 (mm)<input id="h" type="number" min="0.1" step="0.1" value="6.3"></label><output id="fov" class="result"></output><small>以 2 × atan(尺寸 / 2焦距) 計算。</small></article><article><h3>總曝光時間</h3><label>單張曝光 (秒)<input id="seconds" type="number" min="1" value="300"></label><label>有效張數<input id="frames" type="number" min="1" step="1" value="60"></label><output id="total" class="result"></output><small>不含讀出、抖動與其他等待時間。</small></article></div></section><footer>科學讓我們看見宇宙，藝術讓我們感受宇宙。<p>天文實拍與教材取自原始簡報；器材生成示意非原廠照片。</p></footer></div></main><dialog id="viewer"><div class="viewerbar"><button id="close">關閉 Esc</button><span id="counter"></spa
